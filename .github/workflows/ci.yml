name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ['22.23.4', '24.22.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install ffmpeg (for audio extraction tests)
        timeout-minutes: 3
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version
          else
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run compile
      - run: npm test
      - run: npx vsce package --no-dependencies -o extension.vsix
      - name: Verify webview script is packaged
        run: unzip -l extension.vsix | grep -q 'extension/media/player.js'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node-version == '24.22.1'
        with:
          name: unmute-video-vsix
          path: extension.vsix
          if-no-files-found: error

  # Preserve the repository's required check contexts while the tested runtimes
  # are maintained independently in the matrix above. Both gates require every
  # patched-runtime build to succeed; no Node 20 process is started.
  required-node20-context:
    name: build (20.x)
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all patched-runtime builds
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success

  required-node22-context:
    name: build (22.x)
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all patched-runtime builds
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
